<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace">
  <!-- Background -->
  <rect width="760" height="440" rx="12" fill="#0d1117"/>
  <rect x="1" y="1" width="758" height="438" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="760" height="36" rx="12" fill="#161b22"/>
  <rect x="0" y="24" width="760" height="12" fill="#161b22"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5" fill="#febc2e"/>
  <circle cx="52" cy="18" r="5" fill="#28c840"/>
  <text x="380" y="23" text-anchor="middle" font-size="11" fill="#8b949e">Vector Clock Lab — Space-Time Diagram</text>

  <!-- Process headers -->
  <text x="130" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#7ee787">P1</text>
  <text x="130" y="83" text-anchor="middle" font-size="9" fill="#3fb950">vector clock</text>
  <text x="340" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#79c0ff">P2</text>
  <text x="340" y="83" text-anchor="middle" font-size="9" fill="#388bfd">vector clock</text>
  <text x="550" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#f97583">P3</text>
  <text x="550" y="83" text-anchor="middle" font-size="9" fill="#e05252">vector clock</text>

  <!-- Timeline axes -->
  <line x1="130" y1="92" x2="130" y2="400" stroke="#3fb950" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="340" y1="92" x2="340" y2="400" stroke="#388bfd" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="550" y1="92" x2="550" y2="400" stroke="#e05252" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Time label -->
  <text x="36" y="250" text-anchor="middle" font-size="10" fill="#6e7681" transform="rotate(-90, 36, 250)">time →</text>
  <line x1="44" y1="92" x2="44" y2="400" stroke="#6e7681" stroke-width="1" stroke-dasharray="3,4" stroke-opacity="0.3"/>

  <!-- === EVENTS === -->

  <!-- P1: e1 - local tick -->
  <circle cx="130" cy="120" r="7" fill="#7ee787" stroke="#0d1117" stroke-width="2"/>
  <text x="85" y="118" text-anchor="end" font-size="9" fill="#7ee787">{1,0,0}</text>

  <!-- P1: e2 - send to P2 -->
  <circle cx="130" cy="170" r="7" fill="#7ee787" stroke="#0d1117" stroke-width="2"/>
  <text x="85" y="168" text-anchor="end" font-size="9" fill="#7ee787">{2,0,0}</text>
  <!-- arrow P1→P2 -->
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ffa657" opacity="0.85"/>
    </marker>
    <marker id="ah2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bc8cff" opacity="0.85"/>
    </marker>
    <marker id="ah3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" opacity="0.85"/>
    </marker>
  </defs>
  <line x1="137" y1="174" x2="326" y2="218" stroke="#ffa657" stroke-width="1.5" stroke-opacity="0.85" marker-end="url(#ah)"/>
  <text x="220" y="195" text-anchor="middle" font-size="8" fill="#ffa657" opacity="0.8">m1</text>

  <!-- P2: f1 - recv from P1 -->
  <circle cx="340" cy="222" r="7" fill="#79c0ff" stroke="#0d1117" stroke-width="2"/>
  <text x="295" y="220" text-anchor="end" font-size="9" fill="#79c0ff">{2,1,0}</text>

  <!-- P2: f2 - local tick -->
  <circle cx="340" cy="270" r="7" fill="#79c0ff" stroke="#0d1117" stroke-width="2"/>
  <text x="295" y="268" text-anchor="end" font-size="9" fill="#79c0ff">{2,2,0}</text>

  <!-- P2: f3 - send to P3 -->
  <circle cx="340" cy="310" r="7" fill="#79c0ff" stroke="#0d1117" stroke-width="2"/>
  <text x="295" y="308" text-anchor="end" font-size="9" fill="#79c0ff">{2,3,0}</text>
  <!-- arrow P2→P3 -->
  <line x1="347" y1="314" x2="536" y2="353" stroke="#bc8cff" stroke-width="1.5" stroke-opacity="0.85" marker-end="url(#ah2)"/>
  <text x="445" y="328" text-anchor="middle" font-size="8" fill="#bc8cff" opacity="0.8">m2</text>

  <!-- P1: e3 - local tick -->
  <circle cx="130" cy="260" r="7" fill="#7ee787" stroke="#0d1117" stroke-width="2"/>
  <text x="85" y="258" text-anchor="end" font-size="9" fill="#7ee787">{3,0,0}</text>

  <!-- P1: e4 - send concurrent to P3 -->
  <circle cx="130" cy="300" r="7" fill="#7ee787" stroke="#0d1117" stroke-width="2"/>
  <text x="85" y="298" text-anchor="end" font-size="9" fill="#7ee787">{4,0,0}</text>
  <!-- arrow P1→P3 concurrent -->
  <line x1="137" y1="303" x2="536" y2="373" stroke="#58a6ff" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="5,3" marker-end="url(#ah3)"/>
  <text x="335" y="355" text-anchor="middle" font-size="8" fill="#58a6ff" opacity="0.7">m3 (concurrent)</text>

  <!-- P3: g1 - recv from P2 -->
  <circle cx="550" cy="358" r="7" fill="#f97583" stroke="#0d1117" stroke-width="2"/>
  <text x="600" y="356" text-anchor="start" font-size="9" fill="#f97583">{2,3,1}</text>

  <!-- P3: g2 - recv concurrent from P1 -->
  <circle cx="550" cy="382" r="7" fill="#f97583" stroke="#0d1117" stroke-width="2"/>
  <text x="600" y="380" text-anchor="start" font-size="9" fill="#f97583">{4,3,2}</text>

  <!-- P3: g0 - early local -->
  <circle cx="550" cy="150" r="7" fill="#f97583" stroke="#0d1117" stroke-width="2"/>
  <text x="600" y="148" text-anchor="start" font-size="9" fill="#f97583">{0,0,1}</text>

  <!-- Concurrent indicator annotation -->
  <rect x="480" y="330" width="120" height="22" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="540" y="345" text-anchor="middle" font-size="9" fill="#8b949e">∥ concurrent events</text>

  <!-- Snapshot cut line -->
  <line x1="95" y1="290" x2="585" y2="290" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="8,4" stroke-opacity="0.7"/>
  <rect x="596" y="280" width="80" height="20" rx="4" fill="#272115" stroke="#e3b341" stroke-width="1" stroke-opacity="0.7"/>
  <text x="636" y="294" text-anchor="middle" font-size="9" fill="#e3b341">snapshot cut</text>

  <!-- Legend -->
  <rect x="50" y="415" width="670" height="18" rx="4" fill="#161b22"/>
  <circle cx="80" cy="424" r="4" fill="#7ee787"/>
  <text x="90" y="428" font-size="9" fill="#8b949e">send event</text>
  <circle cx="160" cy="424" r="4" fill="#79c0ff"/>
  <text x="170" y="428" font-size="9" fill="#8b949e">receive event</text>
  <line x1="240" y1="420" x2="256" y2="428" stroke="#ffa657" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="264" y="428" font-size="9" fill="#8b949e">causal message</text>
  <line x1="355" y1="420" x2="371" y2="428" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="379" y="428" font-size="9" fill="#8b949e">concurrent message</text>
  <line x1="488" y1="424" x2="510" y2="424" stroke="#e3b341" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="518" y="428" font-size="9" fill="#8b949e">global snapshot cut</text>
</svg>
