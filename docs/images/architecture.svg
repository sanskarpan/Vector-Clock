<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace">
  <!-- Background -->
  <rect width="760" height="360" rx="12" fill="#0d1117"/>
  <rect x="1" y="1" width="758" height="358" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="760" height="36" rx="12" fill="#161b22"/>
  <rect x="0" y="24" width="760" height="12" fill="#161b22"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5" fill="#febc2e"/>
  <circle cx="52" cy="18" r="5" fill="#28c840"/>
  <text x="380" y="23" text-anchor="middle" font-size="11" fill="#8b949e">Vector Clock Lab — System Architecture</text>

  <!-- === Browser layer === -->
  <rect x="260" y="50" width="240" height="48" rx="8" fill="#1c2128" stroke="#388bfd" stroke-width="1.5"/>
  <text x="380" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#79c0ff">Browser</text>
  <text x="380" y="86" text-anchor="middle" font-size="9" fill="#8b949e">D3 · TypeScript · nanostores</text>

  <!-- Browser → BFF arrow -->
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6e7681"/></marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#ffa657"/></marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#3fb950"/></marker>
    <marker id="a4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bc8cff"/></marker>
  </defs>
  <line x1="380" y1="98" x2="380" y2="116" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="390" y="110" font-size="8" fill="#6e7681">REST + WS</text>

  <!-- BFF layer -->
  <rect x="240" y="118" width="280" height="48" rx="8" fill="#1c2128" stroke="#ffa657" stroke-width="1.5"/>
  <text x="380" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffa657">BFF (Bun + Elysia :3001)</text>
  <text x="380" y="154" text-anchor="middle" font-size="9" fill="#8b949e">REST proxy · WS passthrough · Auth forwarding</text>

  <!-- BFF → Gateway arrow -->
  <line x1="380" y1="166" x2="380" y2="184" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="390" y="178" font-size="8" fill="#6e7681">HTTP + WS :8080</text>

  <!-- Gateway layer -->
  <rect x="180" y="186" width="400" height="58" rx="8" fill="#1c2128" stroke="#e3b341" stroke-width="1.5"/>
  <text x="380" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#e3b341">Gateway (Gin :8080)</text>
  <text x="380" y="224" text-anchor="middle" font-size="9" fill="#8b949e">/api/v1/ · /ws · /metrics · auth middleware · TLS · rate limit</text>
  <text x="380" y="238" text-anchor="middle" font-size="9" fill="#6e7681">Prometheus metrics · OpenTelemetry tracing</text>

  <!-- Gateway → Simulation arrow -->
  <line x1="380" y1="244" x2="380" y2="262" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- Simulation layer -->
  <rect x="60" y="264" width="640" height="76" rx="8" fill="#1c2128" stroke="#3fb950" stroke-width="1.5"/>
  <text x="380" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#7ee787">Simulation Engine</text>

  <!-- Sub-boxes inside simulation -->
  <rect x="80" y="292" width="120" height="36" rx="5" fill="#161b22" stroke="#3fb950" stroke-width="1" stroke-opacity="0.6"/>
  <text x="140" y="307" text-anchor="middle" font-size="9" fill="#7ee787">N × Process</text>
  <text x="140" y="320" text-anchor="middle" font-size="8" fill="#6e7681">clock · queue · kv</text>

  <rect x="220" y="292" width="120" height="36" rx="5" fill="#161b22" stroke="#e05252" stroke-width="1" stroke-opacity="0.6"/>
  <text x="280" y="307" text-anchor="middle" font-size="9" fill="#f97583">Snapshot Coord.</text>
  <text x="280" y="320" text-anchor="middle" font-size="8" fill="#6e7681">Chandy-Lamport</text>

  <rect x="360" y="292" width="120" height="36" rx="5" fill="#161b22" stroke="#388bfd" stroke-width="1" stroke-opacity="0.6"/>
  <text x="420" y="307" text-anchor="middle" font-size="9" fill="#79c0ff">SimTransport</text>
  <text x="420" y="320" text-anchor="middle" font-size="8" fill="#6e7681">FIFO channels</text>

  <rect x="500" y="292" width="120" height="36" rx="5" fill="#161b22" stroke="#bc8cff" stroke-width="1" stroke-opacity="0.6"/>
  <text x="560" y="307" text-anchor="middle" font-size="9" fill="#d2a8ff">EventBus</text>
  <text x="560" y="320" text-anchor="middle" font-size="8" fill="#6e7681">pub/sub fan-out</text>

  <!-- Clock types box -->
  <rect x="60" y="292" width="12" height="36" rx="3" fill="#161b22" stroke="#3fb950" stroke-width="0" stroke-opacity="0"/>

  <!-- Clocks callout on right -->
  <rect x="650" y="186" width="96" height="86" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="698" y="202" text-anchor="middle" font-size="9" font-weight="bold" fill="#8b949e">Clock types</text>
  <text x="698" y="218" text-anchor="middle" font-size="9" fill="#7ee787">lamport</text>
  <text x="698" y="232" text-anchor="middle" font-size="9" fill="#79c0ff">vector</text>
  <text x="698" y="246" text-anchor="middle" font-size="9" fill="#ffa657">matrix</text>
  <text x="698" y="260" text-anchor="middle" font-size="9" fill="#d2a8ff">dvv / vv</text>

  <!-- Legend row -->
  <rect x="60" y="350" width="640" height="4" rx="2" fill="none"/>
  <rect x="60" y="352" width="108" height="1" fill="#388bfd" opacity="0.5"/>
  <text x="114" y="359" text-anchor="middle" font-size="8" fill="#388bfd">BFF layer</text>
  <rect x="210" y="352" width="108" height="1" fill="#e3b341" opacity="0.5"/>
  <text x="264" y="359" text-anchor="middle" font-size="8" fill="#e3b341">gateway</text>
  <rect x="360" y="352" width="108" height="1" fill="#3fb950" opacity="0.5"/>
  <text x="414" y="359" text-anchor="middle" font-size="8" fill="#3fb950">simulation</text>
  <rect x="510" y="352" width="108" height="1" fill="#bc8cff" opacity="0.5"/>
  <text x="564" y="359" text-anchor="middle" font-size="8" fill="#bc8cff">event bus</text>
</svg>
